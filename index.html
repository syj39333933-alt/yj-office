<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FAF7F2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="영주 AI 오피스">
<meta name="application-name" content="영주 AI 오피스">
<meta name="format-detection" content="telephone=no">
<title>영주 AI 오피스</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --cream:#FAF7F2; --ink:#3E342C; --sub:#8B7D70; --line:#EBE2D6;
  --accent:#8A5A3B; --accent-d:#74492E; --err:#C0452F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh; min-height:100dvh;
  display:grid; place-items:center;
  padding:calc(28px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
  background:radial-gradient(120% 80% at 50% 0%, #FFFDFA 0%, #FAF7F2 46%, #F3EDE3 100%);
  color:var(--ink);
  font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
.card{
  width:100%; max-width:360px; background:#fff; border-radius:26px;
  padding:30px 24px 22px; text-align:center;
  border:1px solid rgba(235,226,214,.9);
  box-shadow:0 1px 2px rgba(90,66,48,.04), 0 20px 48px -16px rgba(90,66,48,.18);
  transition:opacity .18s ease;
}
body.checking .card{opacity:0;pointer-events:none}
.ico{
  width:64px;height:64px;margin:0 auto;border-radius:19px;
  display:grid;place-items:center;
  background:linear-gradient(160deg,#9C6B4A 0%,#8A5A3B 52%,#6E4527 100%);
  box-shadow:0 8px 18px -8px rgba(110,69,39,.65), inset 0 1px 0 rgba(255,255,255,.28);
}
.ico span{
  font-size:31px;font-weight:800;line-height:1;color:#FAF7F2;letter-spacing:-1px;
  transform:translateY(-1px);
}
h1{font-size:19px;font-weight:800;letter-spacing:-.45px;margin:18px 0 7px;color:var(--ink)}
.sub{font-size:13.5px;color:var(--sub);margin:0 0 22px;letter-spacing:-.2px}
form{margin:0}
.field{position:relative}
.field input{
  width:100%;height:52px;border-radius:14px;border:1.5px solid var(--line);
  background:#FDFBF8;padding:0 50px 0 16px;
  font-size:16px;color:var(--ink);font-family:inherit;
  transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
}
.field input::placeholder{color:#B9ADA1}
.field input:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px rgba(138,90,59,.09)}
.eye{
  position:absolute;right:5px;top:50%;transform:translateY(-50%);
  width:42px;height:42px;display:grid;place-items:center;
  border:0;background:transparent;border-radius:11px;color:#A8998B;padding:0;
  cursor:pointer;
}
.eye:active{background:#F4EEE5}
.eye svg{width:20px;height:20px;display:block}
.remember{display:flex;align-items:center;gap:9px;margin:15px 2px 18px;font-size:13.5px;color:var(--sub);text-align:left;cursor:pointer;user-select:none}
.remember input{width:18px;height:18px;margin:0;accent-color:var(--accent);flex:0 0 auto}
.go{
  width:100%;height:52px;border:0;border-radius:15px;
  background:linear-gradient(180deg,#946347 0%,#8A5A3B 60%,#7E5033 100%);
  color:#fff;font-size:16px;font-weight:700;font-family:inherit;letter-spacing:-.2px;
  box-shadow:0 10px 20px -10px rgba(138,90,59,.75);
  cursor:pointer;transition:transform .12s ease, filter .15s ease;
}
.go:active{transform:translateY(1px);filter:brightness(.97)}
.go[disabled]{opacity:.72;cursor:default;transform:none}
.err{min-height:19px;margin:13px 0 0;font-size:13px;line-height:1.45;color:var(--err);opacity:0;transition:opacity .18s ease;letter-spacing:-.2px}
.err.show{opacity:1}
.foot{margin:17px 0 0;font-size:11.5px;color:#B4A89C;letter-spacing:.1px}
.shake{animation:shake .32s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
.spinner{position:fixed;inset:0;display:none;place-items:center;pointer-events:none}
body.checking .spinner{display:grid}
.spin{width:28px;height:28px;border-radius:50%;border:2.5px solid #E8DECD;border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.shake{animation:none}.spin{animation-duration:2s}}
</style>
</head>
<body>
<div class="spinner" aria-hidden="true"><div class="spin"></div></div>
<main class="card" id="card">
  <div class="ico"><span>영</span></div>
  <h1>🔒 영주 AI 오피스</h1>
  <p class="sub">비밀번호를 입력해 주세요</p>
  <form id="f" novalidate>
    <div class="field">
      <input id="pw" type="password" name="pw" placeholder="비밀번호" aria-label="비밀번호"
             autocomplete="current-password" autocapitalize="off" autocorrect="off"
             spellcheck="false" enterkeyhint="go" inputmode="text">
      <button type="button" class="eye" id="eye" aria-label="비밀번호 보기" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2.2 12S5.8 5.6 12 5.6 21.8 12 21.8 12 18.2 18.4 12 18.4 2.2 12 2.2 12z"/>
          <circle cx="12" cy="12" r="3.1"/>
        </svg>
      </button>
    </div>
    <label class="remember"><input type="checkbox" id="rm" checked><span>이 기기에서 기억하기</span></label>
    <button type="submit" class="go" id="go">열기</button>
    <p class="err" id="err" role="alert" aria-live="polite"></p>
  </form>
  <p class="foot">🔐 내용은 암호화되어 있어요</p>
</main>

<script>
(function(){
  "use strict";

  var SALT_B64 = "EMyNo0i0uynTqBHBVtPAMg==";
  var IV_B64 = "pi+HQ2qTn13rYGXm";
  var ITER = 250000;
  var AAD_STR = "yj-office:v1";
  var STORE = "yjOfficeUnlock.v1";

  var payloadEl = document.getElementById("payload");
  var form = document.getElementById("f");
  var pwEl = document.getElementById("pw");
  var eyeEl = document.getElementById("eye");
  var rmEl = document.getElementById("rm");
  var goEl = document.getElementById("go");
  var errEl = document.getElementById("err");
  var cardEl = document.getElementById("card");
  var enc = new TextEncoder();

  function b64ToBytes(b64){
    var bin = atob(b64), n = bin.length, u = new Uint8Array(n);
    for (var i = 0; i < n; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  function bytesToB64(buf){
    var u = new Uint8Array(buf), s = "", CH = 0x8000;
    for (var i = 0; i < u.length; i += CH){
      s += String.fromCharCode.apply(null, u.subarray(i, i + CH));
    }
    return btoa(s);
  }
  function showErr(msg){
    errEl.textContent = msg;
    errEl.classList.add("show");
    cardEl.classList.remove("shake");
    void cardEl.offsetWidth;
    cardEl.classList.add("shake");
  }
  function clearErr(){
    errEl.textContent = "";
    errEl.classList.remove("show");
  }
  function setBusy(busy){
    goEl.disabled = busy;
    goEl.textContent = busy ? "여는 중…" : "열기";
  }
  function available(){
    return !!(window.crypto && window.crypto.subtle && window.TextDecoder && window.atob);
  }
  function decryptWithKey(key){
    return window.crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(IV_B64), additionalData: enc.encode(AAD_STR) },
      key,
      b64ToBytes(payloadEl.textContent.replace(/\s+/g, ""))
    ).then(function(buf){
      return new TextDecoder("utf-8").decode(buf);
    });
  }
  function deriveKey(pw){
    return window.crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"])
      .then(function(base){
        return window.crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64ToBytes(SALT_B64), iterations: ITER, hash: "SHA-256" },
          base,
          { name: "AES-GCM", length: 256 },
          true,
          ["decrypt"]
        );
      });
  }
  function importRawKey(b64){
    return window.crypto.subtle.importKey("raw", b64ToBytes(b64), { name: "AES-GCM" }, false, ["decrypt"]);
  }
  function render(html){
    document.open();
    document.write(html);
    document.close();
  }
  function getSaved(){
    try { return window.localStorage.getItem(STORE); } catch(e){ return null; }
  }
  function setSaved(v){
    try {
      if (v) window.localStorage.setItem(STORE, v);
      else window.localStorage.removeItem(STORE);
    } catch(e){}
  }

  /* ---------- password show / hide ---------- */
  eyeEl.addEventListener("click", function(){
    var hidden = pwEl.type === "password";
    pwEl.type = hidden ? "text" : "password";
    eyeEl.setAttribute("aria-pressed", hidden ? "true" : "false");
    eyeEl.setAttribute("aria-label", hidden ? "비밀번호 숨기기" : "비밀번호 보기");
    try { pwEl.focus({ preventScroll: true }); } catch(e){ pwEl.focus(); }
    var v = pwEl.value;
    try { pwEl.setSelectionRange(v.length, v.length); } catch(e){}
  });
  pwEl.addEventListener("input", clearErr);

  /* ---------- submit ---------- */
  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    if (goEl.disabled) return;
    if (!available()){
      showErr("이 브라우저에서는 열 수 없어요. 크롬에서 열어 주세요.");
      return;
    }
    var pw = pwEl.value;
    if (!pw){
      showErr("비밀번호를 입력해 주세요.");
      return;
    }
    clearErr();
    setBusy(true);
    deriveKey(pw).then(function(key){
      return decryptWithKey(key).then(function(html){
        if (rmEl.checked){
          return window.crypto.subtle.exportKey("raw", key).then(function(raw){
            setSaved(bytesToB64(raw));
          }).catch(function(){}).then(function(){ return html; });
        }
        setSaved(null);
        return html;
      });
    }).then(function(html){
      try { render(html); }
      catch(e){
        setBusy(false);
        showErr("여는 중 문제가 생겼어요. 잠시 후 다시 시도해 주세요.");
      }
    }).catch(function(){
      setBusy(false);
      pwEl.select();
      showErr("비밀번호가 맞지 않아요");
    });
  });

  /* ---------- auto unlock on this device ---------- */
  function boot(){
    var saved = getSaved();
    if (!saved || !available()) return;
    document.body.classList.add("checking");
    importRawKey(saved).then(decryptWithKey).then(function(html){
      try { render(html); }
      catch(e){
        document.body.classList.remove("checking");
        setSaved(null);
      }
    }).catch(function(){
      document.body.classList.remove("checking");
      setSaved(null);
    });
  }
  if (document.readyState === "complete" || document.readyState === "interactive"){
    boot();
  } else {
    document.addEventListener("DOMContentLoaded", boot);
  }
})();
</script>
